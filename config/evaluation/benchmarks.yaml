# @package evaluation.benchmarks
datasets:
  - name: "AIME24"
    path: "data/benchmarks/aime24.jsonl"
  - name: "AIME25" 
    path: "data/benchmarks/aime25.jsonl"
  - name: "HMMT24"
    path: "data/benchmarks/hmmt24.jsonl"
  - name: "HMMT25"
    path: "data/benchmarks/hmmt25.jsonl"

evaluation:
  max_tokens: 16384
  max_model_len: 32768
  temperature: 1.0
  logprobs: 5  # 로그 확률 개수 (신뢰도 계산에 사용)
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  timeout: 60
  gpu_memory_utilization: 0.95  # GPU 메모리 사용률 (사용 가능한 메모리에 맞춰 조정)
  checkpoint_num: 2400  # null이면 AggLLM 모델 로드 건너뜀, 숫자 지정 시 checkpoint-{숫자} 사용
  enable_thinking: false  # enable_thinking=True일 때 <think> 태그 사용, group_size=2048 사용
  confidence_group_size: 2048  # enable_thinking=True일 때 사용할 group_size
  results_dir: "comprehensive_results/Qwen_Qwen3-1.7B_think_True_32768"
  experiment_name: "4000_32_naive"
  checkpoint_interval: 100
  aggregation_do_analysis: false
  aggregation_do_generation: true
  aggregation_do_evaluation: true
  skip_baseline: false # true일 때 baseline 결과 생성 건너뜀
  filter_max_tokens: 32768
  aggregation_group_sizes: [8]  # 필요 시 [8,4, 2, 1] 등으로 재설정 가능
  aggregation_prompt_variant: "default" # "default", "without_confidence"
  aggregation_confidence:
    metrics:
      - key: "mean_group_confidence"
        label: "Mean"
      - key: "lowest_group_confidence"
        label: "Lowest"
      - key: "bottom_10_percent_confidence"
        label: "Bottom10%"
      - key: "tail_confidence"
        label: "Tail"
    subsets:
      - name: "without_confidence"
        display_name: "No Confidence"
        include_confidence: false
        subset_size: 0
      - name: "single_confidence"
        display_name: "Single Confidence"
        subset_size: 1
      - name: "all_confidence"
        display_name: "All Confidence"
        subset_size: 4

metrics:
  primary: "pass_at_1"
  secondary: ["pass_at_k", "confidence_correlation"]
  
output:
  format: "json"
  save_predictions: true